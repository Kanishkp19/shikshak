<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" width="420" height="320">
  <!-- Plant Cell -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Rigid Cell Wall -->
    <polygon points="50,40 370,40 400,160 370,280 50,280 20,160" fill="#dcfce7" stroke="#15803d" stroke-width="8"/>
    <!-- Plasma Membrane -->
    <polygon points="56,48 364,48 392,160 364,272 56,272 28,160" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
    <!-- Large Central Vacuole -->
    <path d="M120,90 C220,70 320,100 330,190 C340,260 220,250 140,240 C90,230 80,140 120,90 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <!-- Nucleus pushed to side -->
    <circle cx="80" cy="180" r="28" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <circle cx="76" cy="176" r="10" fill="#a16207"/>
    <!-- Chloroplasts -->
    <g fill="#86efac" stroke="#16a34a" stroke-width="2">
      <ellipse cx="280" cy="80" rx="20" ry="12" transform="rotate(-15 280 80)"/>
      <ellipse cx="340" cy="220" rx="18" ry="11" transform="rotate(25 340 220)"/>
      <ellipse cx="180" cy="260" rx="20" ry="12" transform="rotate(5 180 260)"/>
    </g>
    <!-- Mitochondria -->
    <ellipse cx="180" cy="65" rx="16" ry="9" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="100" cy="95" rx="15" ry="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  </g>
</svg>
