<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 300" width="450" height="300">
  <!-- Neuron Structure -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Dendrites -->
    <path d="M70,80 L40,50 M80,60 L60,30 M50,110 L20,100 M60,160 L25,175 M80,185 L50,220 M110,195 L95,240" stroke="#f59e0b" stroke-width="4"/>
    <!-- Soma / Cell body -->
    <path d="M70,90 C50,120 50,160 80,180 C110,195 140,170 150,150 L150,140 C140,110 110,75 70,90 Z" fill="#fef3c7" stroke="#d97706" stroke-width="4"/>
    <!-- Nucleus -->
    <circle cx="100" cy="135" r="18" fill="#fbbf24" stroke="#b45309" stroke-width="3"/>
    <circle cx="97" cy="132" r="6" fill="#78350f"/>
    <!-- Axon Fiber -->
    <line x1="150" y1="145" x2="360" y2="145" stroke="#d97706" stroke-width="5"/>
    <!-- Myelin Sheaths (Schwann cells) -->
    <rect x="165" y="130" width="38" height="30" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <rect x="215" y="130" width="38" height="30" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <rect x="265" y="130" width="38" height="30" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <rect x="315" y="130" width="38" height="30" rx="8" fill="#bae6fd" stroke="#0284c7" stroke-width="3"/>
    <!-- Nodes of Ranvier gaps at 205, 255, 305 -->
    <!-- Axon Terminals / Synaptic Knobs -->
    <path d="M360,145 C380,130 400,105 425,100 M360,145 C385,145 405,145 430,145 M360,145 C380,160 400,185 425,190" stroke="#f59e0b" stroke-width="4"/>
    <circle cx="425" cy="100" r="5" fill="#d97706"/>
    <circle cx="430" cy="145" r="5" fill="#d97706"/>
    <circle cx="425" cy="190" r="5" fill="#d97706"/>
  </g>
</svg>
